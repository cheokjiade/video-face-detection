<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Face Capture POC</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; }
  #stage { position: relative; display: inline-block; margin: .5rem 0; }
  video { max-width: 100%; max-height: 60vh; background: #000; display: block; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  label { margin-right: 1rem; }
  #faces { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
  .face { background: #222; padding: .5rem; border-radius: 6px; width: 140px; font-size: .8rem; }
  .face img { width: 140px; height: 140px; object-fit: cover; border-radius: 4px; }
  #perf { background: #000; padding: .5rem; font-size: .8rem; color: #6f6; white-space: pre-wrap; }
  #perf.slow { color: #f88; }
  #log { background: #000; height: 12rem; overflow: auto; font: .8rem monospace; padding: .5rem; white-space: pre; }
</style>
</head>
<body>
<h1>Camera Face Capture POC</h1>
<p id="status">Loading models…</p>
<button id="camera" disabled>Start camera</button>
<select id="cameras" hidden aria-label="Camera"></select>
<label>Scan every <input id="interval" type="number" value="0.5" step="0.1" min="0" style="width:4rem">s (0 = as fast as possible)</label>
<label>Match similarity <input id="threshold" type="number" value="0.5" step="0.05" min="0" max="1" style="width:4rem"></label>
<label>Detect min confidence <input id="detMin" type="number" value="0.2" step="0.05" min="0.05" max="1" style="width:4rem"></label>
<label>New face min confidence <input id="newMin" type="number" value="0.6" step="0.05" min="0.05" max="1" style="width:4rem"></label>
<label>New face min sharpness <input id="minSharp" type="number" value="40" step="10" min="0" style="width:4rem"></label>
<div id="stage">
  <video id="video" muted playsinline></video>
  <canvas id="overlay" aria-hidden="true"></canvas>
</div>
<h2>Performance</h2>
<pre id="perf" aria-live="off">Waiting for first scan…</pre>
<h2>Unique faces (<span id="count">0</span>)</h2>
<div id="faces"></div>
<h2>Log</h2>
<div id="log"></div>

<script type="module">
import { Human } from 'https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.esm.js';

const human = new Human({
  modelBasePath: 'https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/models/',
  backend: new URLSearchParams(location.search).get('backend') || '', // e.g. ?backend=webgl to compare; '' = Human picks
  cacheSensitivity: 0,          // default reuses old results when the frame barely changes: snapshots would lag reality
  filter: { enabled: false },
  face: {
    detector: { maxDetected: 50, minConfidence: 0.2, rotation: false }, // default maxDetected is 1; each face adds alignment + descriptor time
    mesh: { enabled: true },      // needed to align faces for the descriptor
    description: { enabled: true }, // FaceRes: the 1024-value face descriptor used for dedupe
    iris: { enabled: false }, emotion: { enabled: false }, antispoof: { enabled: false }, liveness: { enabled: false },
  },
  body: { enabled: false }, hand: { enabled: false }, object: { enabled: false },
  gesture: { enabled: false }, segmentation: { enabled: false },
});
window.human = human; // handy for poking at it from the browser console

const $ = id => document.getElementById(id);
const video = $('video'), frame = document.createElement('canvas');
frame.getContext('2d', { willReadFrequently: true }); // pixels are read back every scan
const known = []; // { id, descriptor, sharp, times: [], el }

const log = msg => { $('log').textContent += msg + '\n'; $('log').scrollTop = 1e9; console.log(msg); };
const toBox = ([x, y, width, height]) => ({ x, y, width, height }); // Human boxes are [x, y, w, h]

// Each face keeps several descriptors from different views (near/far, head turned); a sighting
// matches a face if it is close to ANY of them. One descriptor per face split one walking person
// into two cards in the Tokyo walk test as her face grew and turned.
// ponytail: linear scan over faces x samples, fine for hundreds of faces; use a vector index for thousands
const MAX_SAMPLES = 20, NEW_VIEW_BELOW = 0.8; // add a sample only when the view is noticeably different
function bestMatch(descriptor, faces) {
  let face = null, sim = 0;
  for (const f of faces) for (const d of f.samples) {
    const s = human.match.similarity(descriptor, d); // 0..1, higher = more alike
    if (s > sim) { face = f; sim = s; }
  }
  return { face, sim };
}

// Blur score: variance of the Laplacian on a fixed-size grey crop (higher = sharper).
// Detector confidence stays ~97-100% on blurred faces, so it can't be used for this.
const sharpCanvas = Object.assign(document.createElement('canvas'), { width: 64, height: 64 });
function sharpness(source, box) {
  const S = 64, ctx = sharpCanvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, box.x, box.y, box.width, box.height, 0, 0, S, S);
  const d = ctx.getImageData(0, 0, S, S).data, g = new Float32Array(S * S);
  for (let i = 0; i < g.length; i++) g[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
  let sum = 0, sq = 0, n = 0;
  for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) {
    const i = y * S + x, lap = g[i - 1] + g[i + 1] + g[i - S] + g[i + S] - 4 * g[i];
    sum += lap; sq += lap * lap; n++;
  }
  return sq / n - (sum / n) ** 2;
}

function snapshot(box) {
  const pad = box.width * 0.3, c = document.createElement('canvas');
  const x = Math.max(0, box.x - pad), y = Math.max(0, box.y - pad);
  const w = Math.min(frame.width - x, box.width + pad * 2), h = Math.min(frame.height - y, box.height + pad * 2);
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(frame, x, y, w, h, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.9); // this is what you'd POST to the API later
}

function addFace(f, box, sharp, t) {
  const face = { id: known.length + 1, samples: [f.embedding], sharp, times: [t], el: document.createElement('div') };
  face.el.className = 'face';
  face.el.innerHTML = `<img src="${snapshot(box)}" alt="Face ${face.id}"><div><b>#${face.id}</b> <span class="t"></span></div>`;
  $('faces').append(face.el);
  known.push(face);
  $('count').textContent = known.length;
  return face;
}

function render(face) {
  const t = face.times;
  face.el.querySelector('.t').textContent = `${t[0]}–${t[t.length - 1]} · ${t.length} seen`;
  face.el.title = t.join(', ');
}

// ---- performance: scan timing, FPS, memory ----
const perf = { n: 0, recent: [], max: 0, scanStamps: [], frameStamps: [] };
const MB = b => (b / 1048576).toFixed(1) + ' MB';
const perSec = stamps => { const now = performance.now(); while (stamps.length && now - stamps[0] > 2000) stamps.shift(); return stamps.length / 2; };

function showPerf(copy, model, match, faces) {
  const total = copy + model + match, budget = +$('interval').value * 1000;
  perf.n++; perf.max = Math.max(perf.max, total); perf.scanStamps.push(performance.now());
  perf.recent = [...perf.recent.slice(-19), total]; // rolling window shows thermal slowdown that a lifetime average hides
  const avg = perf.recent.reduce((a, b) => a + b) / perf.recent.length;
  const slow = budget > 0 && avg > budget * 0.6; // scans eating most of the interval = preview stutters, interval drifts
  const tf = human.tf.memory(), r = n => n.toFixed(0);
  const cam = video.srcObject?.getVideoTracks()[0]?.getSettings() ?? {};
  const heap = performance.memory ? MB(performance.memory.usedJSHeapSize) : 'n/a (Chromium only)';
  $('perf').textContent = [
    `${budget === 0 ? 'CONTINUOUS' : slow ? 'SLOW' : 'OK'} · avg ${r(avg)} ms over last ${perf.recent.length} scans · max ${r(perf.max)} ms · budget ${budget || '—'} ms · ${perf.n} scans`,
    `FPS: scanning ${perSec(perf.scanStamps).toFixed(1)}/s (device could do ${(1000 / avg).toFixed(1)}/s) · page ${r(perSec(perf.frameStamps))}/s · camera ${cam.frameRate ? r(cam.frameRate) : '?'}/s`,
    `Last scan ${r(total)} ms = frame copy ${r(copy)} + models ${r(model)} + matching ${r(match)} · ${faces} face(s)`,
    `Memory: TF.js ${MB(tf.numBytes)} in ${tf.numTensors} tensors${tf.numBytesInGPU != null ? ` · GPU ${MB(tf.numBytesInGPU)}` : ''} · JS heap ${heap}`,
    `Backend ${human.tf.getBackend()} · camera ${video.videoWidth}×${video.videoHeight} · ${perf.loadMs}`,
  ].join('\n');
  $('perf').className = slow ? 'slow' : '';
}

// Boxes are drawn at the scanned frame's pixel size; CSS stretches the canvas over the video.
// They are as old as the last scan, so at a 0.5 s interval they trail moving people.
function drawBoxes(boxes) {
  const c = $('overlay'), ctx = c.getContext('2d');
  c.width = frame.width; c.height = frame.height; // also clears
  const lw = Math.max(2, frame.width / 320);
  ctx.lineWidth = lw; ctx.font = `bold ${lw * 7}px system-ui, sans-serif`; ctx.textBaseline = 'bottom';
  for (const { box, label, ok } of boxes) {
    ctx.strokeStyle = ctx.fillStyle = ok ? '#3f3' : '#fc3'; // green = matched/new card, yellow = rejected (blurry/unsure)
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    const w = ctx.measureText(label).width + lw * 2, h = lw * 8, y = Math.max(h, box.y);
    ctx.fillRect(box.x - lw / 2, y - h, w, h);
    ctx.fillStyle = '#000'; ctx.fillText(label, box.x + lw / 2, y - lw / 2);
  }
}

async function scan() {
  const t = new Date().toLocaleTimeString(), t0 = performance.now();
  frame.width = video.videoWidth; frame.height = video.videoHeight;
  frame.getContext('2d').drawImage(video, 0, 0); // freeze the frame so the crop matches the detection
  const t1 = performance.now();
  human.config.face.detector.minConfidence = +$('detMin').value; // 0.2 found ~2x the faces of 0.5 in crowd tests, at ~2x the time
  const res = await human.detect(frame);
  if (res.error) throw new Error(res.error);
  const t2 = performance.now();
  // The detector occasionally returns two boxes for one face (seen in the Tokyo walk test), which made a
  // duplicate card. Drop any box whose centre lies inside a higher-scoring box.
  const inside = (f, g) => { const cx = f.box[0] + f.box[2] / 2, cy = f.box[1] + f.box[3] / 2;
    return cx > g.box[0] && cx < g.box[0] + g.box[2] && cy > g.box[1] && cy < g.box[1] + g.box[3]; };
  const faces = res.face.filter(f => f.embedding?.length).sort((a, b) => b.score - a.score)
    .filter((f, i, all) => !all.slice(0, i).some(g => inside(f, g)));
  const seen = [], boxes = [], claimed = new Set(); // one person can't appear twice in a frame
  for (const f of faces) {
    const box = toBox(f.box), sharp = sharpness(frame, box);
    const tag = `${Math.round(f.score * 100)}%/s${Math.round(sharp)}`;
    const m = bestMatch(f.embedding, known.filter(k => !claimed.has(k)));
    let face = m.sim >= +$('threshold').value ? m.face : null;
    if (face) {
      face.times.push(t);
      if (m.sim < NEW_VIEW_BELOW && face.samples.length < MAX_SAMPLES) face.samples.push(f.embedding);
      if (sharp > face.sharp) { face.sharp = sharp; face.el.querySelector('img').src = snapshot(box); } // keep the sharpest image
    } else if (f.score >= +$('newMin').value && sharp >= +$('minSharp').value) {
      face = addFace(f, box, sharp, t);
      log(`${t}  NEW face #${face.id} (${tag}${m.face ? `, closest was #${m.face.id} at ${m.sim.toFixed(2)}` : ''})`);
    } else { seen.push(`?${tag}`); boxes.push({ box, label: `? ${Math.round(f.score * 100)}%`, ok: false }); continue; } // blurry or unsure: don't start a new face from it
    claimed.add(face);
    seen.push('#' + face.id);
    boxes.push({ box, label: `#${face.id}`, ok: true });
    render(face);
  }
  drawBoxes(boxes);
  const t3 = performance.now(), ms = Math.round(t3 - t0);
  showPerf(t1 - t0, t2 - t1, t3 - t2, faces.length);
  if (faces.length) log(`${t}  ${faces.length} face(s): ${seen.join(' ')}  [${ms} ms]`);
}

let busy = false, lastScan = -Infinity;
function loop() {
  const now = performance.now();
  perf.frameStamps.push(now); perSec(perf.frameStamps); // perSec also trims old stamps
  if (!busy && !video.paused && video.readyState >= 2 && now / 1000 - lastScan >= +$('interval').value) {
    busy = true; lastScan = now / 1000;
    scan().catch(e => log('Error: ' + e.message)).finally(() => busy = false);
  }
  requestAnimationFrame(loop);
}

// Needs HTTPS (GitHub Pages is) or localhost
async function startCamera(deviceId) {
  try {
    video.srcObject?.getTracks().forEach(tr => tr.stop());
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: deviceId
      ? { deviceId: { exact: deviceId }, width: { ideal: 1280 } }
      : { facingMode: 'environment', width: { ideal: 1280 } } }); // first start: rear camera on phones, webcam on laptops
    video.play();
    // camera names are only readable after permission is granted, so list them now
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const sel = $('cameras');
    sel.replaceChildren(...cams.map((c, i) => new Option(c.label || `Camera ${i + 1}`, c.deviceId)));
    sel.value = video.srcObject.getVideoTracks()[0].getSettings().deviceId;
    sel.hidden = cams.length < 2;
    $('camera').hidden = true;
    log(`Camera: ${sel.selectedOptions[0]?.text ?? 'started'}`);
  } catch (e) { log('Camera error: ' + e.message); }
}
$('camera').onclick = () => startCamera();
$('cameras').onchange = e => startCamera(e.target.value);

try {
  const loadStart = performance.now();
  await human.load();
  const warmStart = performance.now();
  $('status').textContent = 'Warming up GPU…';
  await human.warmup(); // first run of each model compiles GPU shaders; do it now, not on the first camera scan
  const s = ms => (ms / 1000).toFixed(1) + ' s';
  perf.loadMs = `Human ${human.version} · models loaded in ${s(warmStart - loadStart)} · GPU warm-up ${s(performance.now() - warmStart)}`;
  log(perf.loadMs);
  // self-check of the dedupe logic
  const a = Array.from({ length: 1024 }, (_, i) => Math.sin(i)), b = a.map(v => -v);
  const m1 = bestMatch(a, [{ id: 1, samples: [b, a] }]), m2 = bestMatch(a, [{ id: 1, samples: [b] }]);
  console.assert(m1.face?.id === 1 && m1.sim === 1, 'any identical sample should match');
  console.assert(m2.sim < 0.5, 'opposite should not match');
  $('status').textContent = `Ready (${human.tf.getBackend()} backend): press Start camera. Faces are scanned continuously.`;
  $('camera').disabled = false;
  loop();
} catch (e) { $('status').textContent = 'Model load failed: ' + e.message; }
</script>
</body>
</html>
